<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NLJR - Not Long; Just Read</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell" id="app-shell">
      <header class="global-header" aria-label="Global navigation">
        <div class="header-inner utility-header">
          <a class="brand-link nav-item" href="/NLJR" data-route="daily" aria-label="Brand Home">
            <span class="brand-symbol" aria-hidden="true">A</span>
          </a>
          <button
            class="mobile-menu-button"
            id="mobile-menu-toggle"
            type="button"
            aria-label="Open navigation menu"
            aria-expanded="false"
            aria-controls="mobile-menu"
          >
            <span></span>
            <span></span>
            <span></span>
          </button>
        </div>

        <div class="header-inner primary-header">
          <nav class="primary-nav" aria-label="NLJR pages">
            <div class="nav-group">
              <div class="nav-group-links unified-nav-links" style="display: flex; gap: 20px; align-items: center;">
                <a class="nav-item" href="#daily" data-route="daily">Daily NL;JR</a>
                <a class="nav-item" href="#console" data-route="console">NLJR Console</a>
                <a class="nav-item" href="#archives" data-route="archives">NLJR Archives</a>
              </div>
            </div>
          </nav>
        </div>

        <div class="mobile-menu" id="mobile-menu" hidden>
          <a class="nav-item" href="#daily" data-route="daily">Daily NL;JR</a>
          <a class="nav-item" href="#console" data-route="console">NLJR Console</a>
          <a class="nav-item" href="#archives" data-route="archives">NLJR Archives</a>
        </div>
      </header>

      <main class="workspace">
        <header class="topbar">
          <div>
            <h2 id="page-title">Daily NL;JR</h2>
          </div>
        </header>

        <section id="app-view" class="view" aria-live="polite"></section>
      </main>

      <footer class="site-footer" aria-label="Footer">
        <div class="footer-brand">
          <a class="brand-link nav-item" href="/NLJR" data-route="daily" aria-label="Brand Home">
            <span class="brand-symbol" aria-hidden="true">A</span>
          </a>
          <p>Show me how far and fast we can go!</p>
        </div>
        <div class="footer-grid">
          <div>
            <span class="footer-group-title">NLJR</span>
            <a href="#daily" data-route="daily" class="nav-item">Daily NL;JR</a>
            <a href="#console" data-route="console" class="nav-item">NLJR Console</a>
            <a href="#archives" data-route="archives" class="nav-item">NLJR Archives</a>
          </div>
        </div>
      </footer>
    </div>

    <script src="./nljr-app.js"></script>
  </body>
</html>
